[tool.poetry]
name = "roostoo-trading-competition"
version = "0.1.0"
description = "Roostoo competition trading bot and research notebooks."
authors = ["calde"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
pandas = "^2.2.3"
numpy = "^2.1.3"
requests = "^2.32.3"
nbformat = "^5.10.4"
matplotlib = "^3.9.2"
seaborn = "^0.13.2"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.4"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"
